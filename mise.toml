[tools]
bun = "1.3.5"

[tasks.dev]
description = "Start the Astro dev server"
run = "bun run dev"

[tasks.check]
description = "Run Astro type checks"
run = "bun run check"

[tasks.build]
description = "Build the Astro site"
run = "bun run build"

[tasks.preview]
description = "Preview the built Astro site"
run = "bun run preview"

[tasks.deploy]
description = "Build and deploy Cloudflare Workers Static Assets"
run = "bun run deploy"

[tasks."wrangler:dry-run"]
description = "Validate the Workers Static Assets deployment without uploading"
depends = ["build"]
run = "./node_modules/.bin/wrangler deploy --dry-run"

[tasks."tf:fmt"]
description = "Check Terraform formatting"
run = "terraform fmt -check -recursive infra/cloudflare"

[tasks."tf:validate"]
description = "Validate the Cloudflare Terraform scaffold"
run = "terraform -chdir=infra/cloudflare validate"

[tasks.verify]
description = "Run local checks for site, Workers config, and Terraform"
depends = ["check", "build", "wrangler:dry-run", "tf:fmt", "tf:validate"]
